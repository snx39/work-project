name: CI/CD Pipeline

on:
  # 1. 门禁：任何人提 PR，只做检查，不部署
  pull_request:
    branches: [dev, staging, main]
  
  # 2. 部署：代码合并（push）到这两个分支后，才触发构建镜像
  push:
    branches: [staging, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install depedencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest app/tests/ -v

      - name: Build Docker image(CI check)
        run: docker build -t ml-app:ci .

  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create Staging .env
        run: echo "${{ secrets.STAGING_ENV }}" > .env
      
      - name: Build Staging Image
        run: docker build -t ml-app:staging .
      
  deploy-prod:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create Production .env
        run: echo "${{ secrets.PROD_ENV }}" > .env
      
      - name: Build Production Image
        run: docker build -t ml-app:prod .